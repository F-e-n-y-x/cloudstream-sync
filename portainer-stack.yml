services:
  cloudstream-sync:
    # Published automatically on every push to master by
    # .github/workflows/docker-publish.yml. Portainer's "Re-pull image and redeploy" option
    # on this stack fetches whatever is newest. To build from source instead, comment this
    # out and uncomment the `build:` line below (pointed at wherever you keep a checkout of
    # this repo on the host running Portainer/Docker).
    image: ghcr.io/f-e-n-y-x/cloudstream-sync:latest
    # build: .
    container_name: cloudstream-sync
    restart: unless-stopped
    ports:
      # Hardcoded rather than driven by a ${SYNC_PORT:-9909}-style variable: Portainer's own
      # variable substitution does not reliably survive a value that starts with a bare
      # colon (SYNC_ADDR below) and has been seen to silently drop one of two otherwise
      # identical-looking port lines - both bit this file when it relied on that. To use a
      # different port, change the literal 9909 in all three places it appears below
      # (these two lines and SYNC_ADDR) rather than introducing a variable back in.
      #
      # Both protocols on the same port number is deliberate, not two unrelated services:
      # TCP carries the HTTP API, UDP carries the LAN discovery broadcast the app sends to
      # find this server without the user typing an IP (cmd/server/discovery.go).
      - "9909:9909"
      - "9909:9909/udp"
    volumes:
      # A named volume rather than docker-compose.yml's ./data bind mount: Portainer's web
      # editor has no repository checkout to resolve a relative host path against, so this
      # is the version of the stack that works pasted in directly. Same durability either
      # way - the data survives replacing the container, not just restarting it.
      - cloudstream_sync_data:/data
    environment:
      SYNC_ADDR: ":9909"
      SYNC_DB: "/data/cloudstream-sync.db"
      # Leave off. Turn it on only long enough to create your first account, then set it
      # back to false and redeploy the stack: with it on, anyone who can reach this server
      # can sign up.
      SYNC_OPEN_REGISTRATION: "false"
    healthcheck:
      # scratch has no shell or curl, so the check runs the binary's own probe.
      test: ["CMD", "/cloudstream-sync", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cloudstream_sync_data:
