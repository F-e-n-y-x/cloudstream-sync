services:
  cloudstream-sync:
    # Published automatically on every push to master by
    # .github/workflows/docker-publish.yml. This pulls it rather than building locally;
    # `docker compose pull && docker compose up -d` fetches whatever is newest. To build
    # from source instead (e.g. you are working on the server itself), comment this out and
    # uncomment the `build: .` line below.
    image: ghcr.io/f-e-n-y-x/cloudstream-sync:latest
    # build: .
    container_name: cloudstream-sync
    restart: unless-stopped
    ports:
      # One place to change the port: SYNC_PORT controls the host mapping and the
      # container's own listen address below, for both protocols. Editing only one of the
      # two used to leave the container listening on a port Docker no longer forwards to
      # (or vice versa), which looked like the server had stopped responding. Override with
      # e.g. `SYNC_PORT=9090 docker compose up -d`, or a `.env` file next to this one
      # containing `SYNC_PORT=9090`.
      #
      # Both protocols on the same port number is deliberate, not two unrelated services:
      # TCP carries the HTTP API, UDP carries the LAN discovery broadcast the app sends to
      # find this server without the user typing an IP (cmd/server/discovery.go).
      - "${SYNC_PORT:-9909}:${SYNC_PORT:-9909}"
      - "${SYNC_PORT:-9909}:${SYNC_PORT:-9909}/udp"
    volumes:
      # A named volume, not a host bind mount: on a fresh checkout there is nothing at
      # ./data yet, and Docker creating that directory itself makes it root-owned - which
      # the container's non-root user then cannot write to. A named volume does not have
      # that problem, since Docker initialises it from the image's own /data (see
      # Dockerfile), owned by that same non-root user already.
      #
      # If you would rather have the database file directly on the host, a bind mount to an
      # *existing* directory works fine - just chown it to 65532:65532 first
      # (`mkdir -p ./data && sudo chown 65532:65532 ./data`), then use `./data:/data` here
      # instead of the line below.
      - cloudstream_sync_data:/data
    environment:
      SYNC_ADDR: ":${SYNC_PORT:-9909}"
      SYNC_DB: "/data/cloudstream-sync.db"
      # Leave off. Turn it on only long enough to create your first account, then set it
      # back to false and restart: with it on, anyone who can reach this server can sign up.
      SYNC_OPEN_REGISTRATION: "false"
    healthcheck:
      # scratch has no shell or curl, so the check runs the binary's own probe.
      test: ["CMD", "/cloudstream-sync", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cloudstream_sync_data:
