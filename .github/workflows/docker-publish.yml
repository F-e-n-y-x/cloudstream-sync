name: Publish container image

# Builds and pushes ghcr.io/f-e-n-y-x/cloudstream-sync on every push to master, so
# docker-compose.yml / portainer-stack.yml's `image:` line always has something current to
# pull. Multi-arch (amd64 + arm64) since the README targets a Raspberry Pi and NAS boxes as
# much as a VPS, and those are commonly arm64.
#
# This publishes the image; it does not redeploy anything already running. Pulling the new
# image and recreating the container on your own host is either a manual `docker compose
# pull && docker compose up -d` (or the Portainer equivalent), or automatic if you run
# something like Watchtower alongside it.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository preserves this account's actual casing (F-e-n-y-x/...), but image
      # references must be all-lowercase - pushing without this lowercases nothing and fails
      # at push time with "invalid reference format".
      - name: Lowercase the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
